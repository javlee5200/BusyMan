        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - codigo
      - fecha_actualizacion
      - fecha_creacion
      - id
      - nombre
    TecnicoCombo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        value:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - id
      - label
      - username
      - value
    TipoDocumentoEnum:
      enum:
      - CC
      - RUC
      - PAS
      - OTRO
      type: string
      description: |-
        * `CC` - Cédula de ciudadanía
        * `RUC` - RUC
        * `PAS` - Pasaporte
        * `OTRO` - Otro
    TipoEnum:
      enum:
      - ENTRADA
      - SALIDA
      - AJUSTE
      type: string
      description: |-
        * `ENTRADA` - Entrada
        * `SALIDA` - Salida
        * `AJUSTE` - Ajuste
    TipoEquipoEnum:
      enum:
      - PORTATIL
      - TORRE
      - ALL_IN_ONE
      - IMPRESORA
      - OTRO
      type: string
      description: |-
        * `PORTATIL` - Portátil
        * `TORRE` - Torre
        * `ALL_IN_ONE` - All in one
        * `IMPRESORA` - Impresora
        * `OTRO` - Otro
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
