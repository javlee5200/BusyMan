      summary: Actualizar orden
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this orden trabajo.
        required: true
      tags:
      - Órdenes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenTrabajo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrdenTrabajo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrdenTrabajo'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenTrabajo'
          description: ''
    patch:
      operationId: ordenes_partial_update
      description: Actualiza una orden. Si cambia el estado, se registra en historial
        automáticamente.
      summary: Actualizar orden (parcial)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this orden trabajo.
        required: true
      tags:
