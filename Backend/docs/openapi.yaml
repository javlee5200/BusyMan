  /api/ordenes/:
    get:
      operationId: ordenes_list
      description: Retorna el listado de órdenes con filtros por estado, técnico y
        equipo.
      summary: Listar órdenes de trabajo
      parameters:
      - in: query
        name: equipo_id
        schema:
          type: integer
        description: Filtrar por equipo
      - in: query
        name: estado
        schema:
          type: string
        description: Filtrar por estado de la orden
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tecnico_id
        schema:
          type: integer
        description: Filtrar por técnico asignado
      tags:
      - Órdenes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdenTrabajo'
          description: ''
    post:
      operationId: ordenes_create
      description: Registra una nueva orden y genera trazabilidad inicial en historial.
      summary: Crear orden de trabajo
      tags:
      - Órdenes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenTrabajo'
            examples:
              CrearOrden-Request:
                value:
                  equipo: 1
                  tecnico_asignado: 2
                  descripcion_falla: No enciende
                  diagnostico: ''
                  solucion: ''
                  costo_estimado: '50000.00'
                  costo_final: '0.00'
                  estado: INGRESADO
                summary: Crear orden - request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrdenTrabajo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrdenTrabajo'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenTrabajo'
          description: ''
  /api/ordenes/{id}/:
    get:
      operationId: ordenes_retrieve
      description: Detalle de la orden con historial.
      summary: Obtener orden
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this orden trabajo.
        required: true
      tags:
      - Órdenes
      security:
      - jwtAuth: []
      responses:
