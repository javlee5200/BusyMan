components:
  schemas:
    Cliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoEnum'
        numero_documento:
          type: string
          maxLength: 30
        telefono:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        direccion:
          type: string
          maxLength: 255
        activo:
          type: boolean
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - apellidos
      - fecha_actualizacion
      - fecha_registro
      - id
      - nombres
      - numero_documento
      - telefono
    ConsumoOrden:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        orden:
          type: integer
        repuesto:
          type: integer
        repuesto_codigo:
          type: string
          readOnly: true
        cantidad:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        usuario:
          type: integer
          readOnly: true
          nullable: true
        fecha:
          type: string
          format: date-time
          readOnly: true
      required:
      - cantidad
      - fecha
      - id
      - orden
      - precio_unitario
      - repuesto
      - repuesto_codigo
      - usuario
    Equipo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cliente:
          type: integer
        cliente_nombre:
          type: string
          readOnly: true
        cliente_apellido:
          type: string
          readOnly: true
        tipo_equipo:
          $ref: '#/components/schemas/TipoEquipoEnum'
        marca:
          type: string
          maxLength: 60
        modelo:
          type: string
          maxLength: 80
        numero_serie:
          type: string
          nullable: true
          maxLength: 100
        accesorios_recibidos:
          type: string
        estado_fisico:
          type: string
        problema_reportado:
          type: string
        estado_actual:
          $ref: '#/components/schemas/EstadoEnum'
        fecha_ingreso:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - cliente
      - cliente_apellido
      - cliente_nombre
      - fecha_actualizacion
      - fecha_ingreso
      - id
      - marca
      - problema_reportado
      - tipo_equipo
    EstadoEnum:
      enum:
      - INGRESADO
      - DIAGNOSTICO
      - REPARACION
      - LISTO
      - ENTREGADO
      type: string
      description: |-
        * `INGRESADO` - Ingresado
        * `DIAGNOSTICO` - En diagnóstico
        * `REPARACION` - En reparación
        * `LISTO` - Listo
        * `ENTREGADO` - Entregado
    HistorialOrden:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        estado_anterior:
          type: string
          readOnly: true
        estado_nuevo:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
        comentario:
          type: string
          readOnly: true
        usuario:
          type: integer
          readOnly: true
          nullable: true
        usuario_username:
          type: string
          readOnly: true
        fecha:
          type: string
          format: date-time
          readOnly: true
      required:
      - comentario
      - estado_anterior
      - estado_nuevo
      - fecha
      - id
      - usuario
      - usuario_username
    MovimientoInventario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        repuesto:
          type: integer
        repuesto_codigo:
          type: string
          readOnly: true
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        cantidad:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        motivo:
          type: string
          maxLength: 255
        orden_referencia:
          type: integer
          nullable: true
        usuario:
          type: integer
          readOnly: true
          nullable: true
        fecha:
          type: string
          format: date-time
          readOnly: true
