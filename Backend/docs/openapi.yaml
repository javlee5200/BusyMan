components:
  schemas:
    Cliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoEnum'
        numero_documento:
          type: string
          maxLength: 30
        telefono:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        direccion:
          type: string
          maxLength: 255
        activo:
          type: boolean
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - apellidos
      - fecha_actualizacion
      - fecha_registro
      - id
      - nombres
      - numero_documento
      - telefono
    Equipo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cliente:
          type: integer
        cliente_nombre:
          type: string
          readOnly: true
        cliente_apellido:
          type: string
          readOnly: true
        tipo_equipo:
          $ref: '#/components/schemas/TipoEquipoEnum'
        marca:
          type: string
          maxLength: 60
        modelo:
          type: string
          maxLength: 80
        numero_serie:
          type: string
          nullable: true
          maxLength: 100
        accesorios_recibidos:
          type: string
        estado_fisico:
          type: string
        problema_reportado:
          type: string
        estado_actual:
          $ref: '#/components/schemas/EstadoActualEnum'
        fecha_ingreso:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - cliente
      - cliente_apellido
      - cliente_nombre
      - fecha_actualizacion
      - fecha_ingreso
      - id
      - marca
      - problema_reportado
      - tipo_equipo
    EstadoActualEnum:
      enum:
      - INGRESADO
      - DIAGNOSTICO
      - REPARACION
      - LISTO
      - ENTREGADO
      type: string
      description: |-
        * `INGRESADO` - Ingresado
        * `DIAGNOSTICO` - En diagnóstico
        * `REPARACION` - En reparación
        * `LISTO` - Listo
        * `ENTREGADO` - Entregado
    PatchedCliente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 100
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoEnum'
        numero_documento:
          type: string
          maxLength: 30
        telefono:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        direccion:
          type: string
          maxLength: 255
        activo:
          type: boolean
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
    PatchedEquipo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cliente:
          type: integer
        cliente_nombre:
          type: string
          readOnly: true
        cliente_apellido:
          type: string
          readOnly: true
        tipo_equipo:
          $ref: '#/components/schemas/TipoEquipoEnum'
        marca:
          type: string
          maxLength: 60
        modelo:
          type: string
          maxLength: 80
        numero_serie:
          type: string
          nullable: true
          maxLength: 100
        accesorios_recibidos:
          type: string
        estado_fisico:
          type: string
        problema_reportado:
          type: string
        estado_actual:
          $ref: '#/components/schemas/EstadoActualEnum'
        fecha_ingreso:
          type: string
          format: date-time
          readOnly: true
        fecha_actualizacion:
          type: string
          format: date-time
          readOnly: true
    TipoDocumentoEnum:
      enum:
      - CC
      - CE
      - NIT
      - OTRO
      type: string
      description: |-
        * `CC` - Cédula de ciudadanía
        * `CE` - Cédula de extranjería
        * `NIT` - NIT
        * `OTRO` - Otro
    TipoEquipoEnum:
      enum:
      - PORTATIL
      - TORRE
      - ALL_IN_ONE
      - IMPRESORA
      - OTRO
      type: string
      description: |-
        * `PORTATIL` - Portátil
        * `TORRE` - Torre
        * `ALL_IN_ONE` - All in one
        * `IMPRESORA` - Impresora
        * `OTRO` - Otro
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Auth
  description: Autenticación y renovación de tokens JWT.
- name: Clientes
  description: Gestión CRUD de clientes.
- name: Equipos
  description: Gestión CRUD de equipos y filtros.
